<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page introuvable — Rapport hebdomadaire KPIs BVD</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:radial-gradient(1000px 600px at 50% 0%,#16222f,#0a0f16 70%);
       color:#eef3f9;font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55}
  .card{max-width:440px;background:#141d29;border:1px solid #263447;border-radius:16px;
        padding:32px 30px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  h1{font-size:20px;margin:0 0 10px;font-weight:600}
  p{color:#8598ac;font-size:14px;margin:0 0 20px}
  a{display:inline-block;background:linear-gradient(135deg,#43c0cb,#2f9aa5);color:#052227;
    text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:9px}
  a:focus-visible{outline:2px solid #43c0cb;outline-offset:3px}
  .code{color:#43c0cb;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
</style>
</head>
<body>
  <main class="card">
    <div class="code">Erreur 404</div>
    <h1>Page introuvable</h1>
    <p>Cette adresse n'existe pas sur le tableau de bord. Le lien est peut-être incomplet ou périmé.</p>
    <a href="./">Retour au tableau de bord</a>
  </main>
</body>
</html>
