name: Update Kobo data & deploy

on:
  schedule:
    - cron: "0 * * * *"      # every hour, on the hour (UTC)
  workflow_dispatch:          # allow manual runs from the Actions tab
  push:
    branches: [ main ]        # redeploy when you edit the dashboard

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch is allowed to fail without blocking the deploy: if Kobo is
      # unreachable or the token is missing, the site still ships with the
      # last committed data/data.json (and the manual import failsafe).
      - name: Fetch latest Kobo data
        continue-on-error: true
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_SERVER: ${{ vars.KOBO_SERVER }}
          KOBO_ASSET_UID: ${{ vars.KOBO_ASSET_UID }}
        run: python scripts/fetch_data.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
